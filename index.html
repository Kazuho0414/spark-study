<script>/* Spark learning engine. All answers use canonical indexes; display order is separate.
 * Scheduling and priority are learning heuristics, not a prediction of passing. */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.LearningEngine = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  const DAY = 86400000, SPACED = 20 * 3600000;
  const DOMAINS = [
    {key:'Architecture',label:'Architecture',weight:.20,quota:9},
    {key:'Spark SQL',label:'Spark SQL',weight:.20,quota:9},
    {key:'DataFrame',label:'DataFrame',weight:.30,quota:14},
    {key:'Tuning',label:'Tuning',weight:.10,quota:4},
    {key:'Structured Streaming',label:'Structured Streaming',weight:.10,quota:5},
    {key:'Spark Connect',label:'Spark Connect',weight:.05,quota:2},
    {key:'Pandas API',label:'Pandas API',weight:.05,quota:2}
  ];
  const CAUSES = [
    {key:'knowledge',label:'知識不足'}, {key:'api',label:'APIの混同'},
    {key:'reading',label:'コード・条件の読み違い'}, {key:'english',label:'英語の条件見落とし'},
    {key:'boundary',label:'NULL・境界条件'}, {key:'time',label:'時間不足'},
    {key:'careless',label:'操作・確認ミス'}, {key:'unknown',label:'未分類'}
  ];
  const CONFIDENCE = ['high','medium','low','unknown'];
  const BAD_KEYS = new Set(['__proto__','prototype','constructor']);
  const copy = x => JSON.parse(JSON.stringify(x));
  const own = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
  const finite = x => typeof x === 'number' && Number.isFinite(x);
  const fail = message => {throw new Error('学習記録が不正です: '+message);};
  const plain = x => !!x && typeof x === 'object' && !Array.isArray(x) && (Object.getPrototypeOf(x) === Object.prototype || Object.getPrototypeOf(x) === null);
  function obj(x,label) {if(!plain(x))fail(label+'はオブジェクトが必要です');return x;}
  function safeKey(k) {if(typeof k!=='string'||!k||k.length>300||BAD_KEYS.has(k))fail('不正な識別子');return k;}
  function number(x,label,min=0,max=Number.MAX_SAFE_INTEGER) {if(!finite(x)||x<min||x>max)fail(label+'の値');return x;}
  function dateMs(x,label) {const n=typeof x==='string'?Date.parse(x):NaN;if(!finite(n))fail(label+'の日付');return n;}
  function shuffle(items) {const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function stableHash(s) {let n=2166136261;for(let i=0;i<s.length;i++){n^=s.charCodeAt(i);n=Math.imul(n,16777619);}return (n>>>0).toString(36);}
  let serial=0;
  function uid(prefix,now) {return prefix+'-'+now.toString(36)+'-'+(++serial).toString(36)+'-'+Math.random().toString(36).slice(2,10);}
  function makeEngine(DATA) {
    const domains=DATA.generic?[]:DOMAINS;
    const questionMap={}, examMap={};
    const allQuestions=[];
    for(const e of DATA.exams||[]) {
      safeKey(e.id); if(own(examMap,e.id))fail('教材の模試IDが重複しています');
      examMap[e.id]=e;
      for(const q of e.questions||[])addQuestion(q);
    }
    for(const q of DATA.variants||[])addQuestion(q);
    for(const q of DATA.additional||[])addQuestion(q);
    function addQuestion(q) {
      safeKey(q.id);if(own(questionMap,q.id))fail('教材の問題IDが重複しています: '+q.id);
      if(!Array.isArray(q.options)||q.options.length<2||!Number.isInteger(q.correct)||q.correct<0||q.correct>=q.options.length)fail('教材の選択肢が不正です: '+q.id);
      questionMap[q.id]=q;allQuestions.push(q);
    }
    const drillIds=new Set((DATA.drills||[]).map(d=>d.id));
    const emptyState=()=>({version:2,attempts:[],sessions:{},sessionTrash:{},drills:{},exposures:{},settings:{}});
    function ids(raw,label) {
      if(!Array.isArray(raw)||!raw.length||raw.length>allQuestions.length)fail(label+'の問題一覧');
      const a=raw.map(id=>{safeKey(id);if(!own(questionMap,id))fail('この教材にない問題: '+id);return id;});
      if(new Set(a).size!==a.length)fail(label+'の問題が重複しています');return a;
    }
    function map(raw,allowed,label,check) {
      const out={},source=raw===undefined?{}:raw;obj(source,label);const allowedSet=new Set(allowed);
      for(const [id,value] of Object.entries(source)) {safeKey(id);if(!allowedSet.has(id))fail(label+'に範囲外の問題があります');out[id]=check(value,id);}
      return out;
    }
    function answerMap(raw,a) {return map(raw,a,'回答',(v,id)=>{if(!Number.isInteger(v)||v<0||v>=questionMap[id].options.length)fail('選択肢の番号: '+id);return v;});}
    function boolMap(raw,a,label,nullable=false) {return map(raw,a,label,v=>{if(typeof v!=='boolean'&&!(nullable&&v===null))fail(label+'の値');return v;});}
    function cleanOrders(raw,a) {
      obj(raw,'選択肢順');const out={};
      for(const id of a) {
        const n=questionMap[id].options.length,o=raw[id];
        if(!Array.isArray(o)||o.length!==n||new Set(o).size!==n||o.some(x=>!Number.isInteger(x)||x<0||x>=n))fail('選択肢順: '+id);
        out[id]=o.slice();
      }
      for(const id of Object.keys(raw))if(!a.includes(id))fail('選択肢順に範囲外の問題');
      return out;
    }
    function cleanCommon(raw,a) {
      if(raw.immediateFeedback!==undefined&&typeof raw.immediateFeedback!=='boolean')fail('即時解説の設定');
      return {
        ...(raw.immediateFeedback===undefined?{}:{immediateFeedback:raw.immediateFeedback}),
        ids:a,optionOrders:cleanOrders(raw.optionOrders,a),answers:answerMap(raw.answers,a),
        ...(raw.answeredAt===undefined?{}:{answeredAt:map(raw.answeredAt,a,'回答日時',v=>number(v,'回答日時'))}),
        ...(raw.englishViewed===undefined?{}:{englishViewed:boolMap(raw.englishViewed,a,'英語補助閲覧')}),
        ...(raw.englishReading===undefined?{}:{englishReading:map(raw.englishReading,a,'英文読み取り',v=>{if(!['unknown','clear','difficult'].includes(v))fail('英文読み取りの値');return v;})}),
        confidence:map(raw.confidence,a,'自信度',v=>{if(!CONFIDENCE.includes(v))fail('自信度の値');return v;}),
        flags:boolMap(raw.flags,a,'要復習'),
        timesMs:map(raw.timesMs,a,'回答時間',v=>number(v,'回答時間',0,365*DAY)),
        notes:map(raw.notes,a,'メモ',v=>{if(typeof v!=='string'||v.length>20000)fail('メモの形式');return v;}),
        shown:map(raw.shown,a,'表示記録',v=>{if(v===true)return v;return number(v,'表示日時');}),
        exposedBefore:boolMap(raw.exposedBefore,a,'初見記録',true),
        choicesRevealed:boolMap(raw.choicesRevealed,a,'選択肢表示'),
        causes:map(raw.causes,a,'誤答原因',v=>{if(!CAUSES.some(c=>c.key===v))fail('誤答原因');return v;})
      };
    }
    function cleanSettings(raw) {
      const source=raw===undefined?{}:raw;obj(source,'設定');const out={};
      for(const [k,v] of Object.entries(source)) {
        safeKey(k);
        if(k.startsWith('flag:')&&(!own(questionMap,k.slice(5))||typeof v!=='boolean'))fail('要復習マークの設定');
        if(typeof v==='boolean'||(finite(v)&&Math.abs(v)<1e12)||(typeof v==='string'&&v.length<=1000))out[k]=v;
        else fail('設定の形式');
      }
      return out;
    }

<script>/* Post-answer English support. All persisted personal data stays inside each bank. */
const EnglishStudy=(()=>{

 const DAY=86400000;
 function matches(q){const text=[q.stem,...q.options].join('\n');return terms.filter(t=>new RegExp('\\b'+t.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(text));}
 function entries(state,E){return E.learningRecords(state).flatMap(a=>a.ids.filter(id=>a.answers[id]!==undefined).map(id=>({a,id,at:a.answeredAt?.[id]||Date.parse(a.date),right:a.answers[id]===E.questionMap[id].correct,viewed:!!a.englishViewed?.[id],reading:a.englishReading?.[id]||'unknown'}))).sort((x,y)=>x.at-y.at);}
 function queue(state,E,now=Date.now()){
  const pending=new Map();for(const r of entries(state,E)){
   const old=pending.get(r.id);
   if(old&&r.at-old.at>=20*3600000&&r.right&&r.reading!=='difficult'&&r.a.causes?.[r.id]!=='english')pending.delete(r.id);
   if(r.reading==='difficult'||r.a.causes?.[r.id]==='english')pending.set(r.id,r);
  }

 }
 function term(id){return terms.find(t=>t.id===id);}
 function saved(state){return Object.keys(state.settings).filter(k=>k.startsWith('english-word:')&&state.settings[k]).map(k=>{const parts=k.slice(13).split('|');return {term:term(parts[0]),id:parts[1],key:k};}).filter(x=>x.term&&Q[x.id]);}
 const WORD_INTERVALS=[0,1,3,7,14,30,60],WORD_RETRY=600;
 const validSecond=x=>Number.isSafeInteger(x)&&x>=0&&x<1e12;
 function wordSchedule(state,key,now=Date.now()){
  let value;try{value=JSON.parse(state.settings['word-schedule:'+key]);}catch{}

   const result=state.settings['word-result:'+key],at=state.settings['word-date:'+key];

  if(!['yes','no'].includes(result)||typeof key!=='string'||!key.startsWith('english-'))throw new Error('英語集の復習記録が不正です。');

function bilingual(en,ja){

 $('#englishDue').onclick=()=>start(true);$('#englishAll').onclick=()=>start(false);$('#englishMock').onclick=()=>begin({key:'englishmock-'+Date.now(),mode:'englishmock',title:'英語模試',ids:E.selectQuestions(state,{kind:'random',count:45,reserveM4:state.settings.reserveM4!==false}),minutes:90,immediateFeedback:false});

<script>/* Short study sets: time is an estimate, never a submission deadline. */
(function(root){
 'use strict';
 function create(engine,state,data,minutes,now=Date.now(),stats=engine.buildStats(state,now)){
  if(![5,15,30].includes(minutes))throw Error('学習時間は5・15・30分から選んでください');
  const values=Object.values(stats.questions).filter(x=>x.answered>0&&Number.isFinite(x.avgSeconds)&&x.avgSeconds>=5).map(x=>x.avgSeconds).sort((a,b)=>a-b);
  const median=values.length?values[Math.floor(values.length/2)]:60;
  // Reserve an extra minute for feedback; observed answer time is not ability.
  const secondsPerQuestion=Math.round(Math.max(30,Math.min(240,median))+60);
  const count=Math.max(1,Math.min(40,Math.floor(minutes*60/secondsPerQuestion)));
  const all=engine.allQuestions.filter(q=>data.generic||state.settings.reserveM4===false||!q.id.startsWith('M4-')||stats.questions[q.id].seen);
  const priority=(a,b)=>(stats.questions[b.id].priority||0)-(stats.questions[a.id].priority||0)||a.id.localeCompare(b.id);
  const pools={due:[],wrong:[],unseen:[],other:[]};
  for(const q of all){const s=stats.questions[q.id];const key=s.answered>0&&s.dueAt!=null&&s.dueAt<=now?'due':s.unresolved?'wrong':!s.seen?'unseen':'other';pools[key].push(q);}
  for(const pool of Object.values(pools))pool.sort(priority);
  const chosen=[],counts={due:0,wrong:0,unseen:0,other:0};
  function take(kind,n){while(n-->0&&pools[kind].length&&chosen.length<count){chosen.push(pools[kind].shift().id);counts[kind]++;}}
  // Mix in new material where possible without letting overdue items disappear.
  const newCount=count>=3&&pools.unseen.length?Math.max(1,Math.floor(count*.2)):0;
  take('due',Math.ceil((count-newCount)*.6));take('wrong',count-newCount-chosen.length);take('unseen',newCount);
  for(const kind of ['due','wrong','unseen','other'])take(kind,count-chosen.length);
  return {minutes,ids:chosen,counts,secondsPerQuestion,estimatedSeconds:chosen.length*secondsPerQuestion,hasTimingHistory:values.length>0};
 }
 root.StudyPlanner={create};
})(typeof globalThis!=='undefined'?globalThis:this);
</script>

function home(){const stats=getStats(),qs=Object.values(stats.questions),due=E.selectQuestions(state,{kind:'due',count:999}).length,wrong=E.selectQuestions(state,{kind:'wrong',count:999}).length;app.innerHTML=`<div class="hero"><div><div class="eyebrow">TODAY'S LEARNING</div><h2>思い出す。確かめる。次につなげる。</h2><p class="muted">前回の誤答と復習時期から、今日の学習を選べます。</p></div><span class="badge">${new Set(E.allQuestions.map(q=>q.domain)).size}分野 / ${DATA.exams.reduce((n,e)=>n+e.questions.length,0)}問${DATA.variants?.length?' + 類題'+DATA.variants.length+'問':''}${DATA.additional.length?' + 追加'+DATA.additional.length+'問':''}</span></div><div class="metrics"><div><b>${due}</b><span>復習期限</span></div><div><b>${wrong}</b><span>未克服の誤答</span></div><div><b>${qs.filter(x=>x.attempts>0).length}</b><span>受験済みの問題</span></div><div><b>${qs.filter(x=>x.mastery==='mastered').length}</b><span>間隔を空けて定着確認</span></div></div><div class="toolbar">${btn('今日の復習を始める','id="todayBtn"',true)}${btn('誤答だけ再テスト','id="wrongBtn"')}${btn('学習メニュー','id="menuBtn"')}${DATA.additional.length?btn('追加問題を解く','id="additionalHomeBtn"'):''}</div>${Object.values(state.sessions).length?`<section class="card"><h3>途中のセッション</h3><div class="resume-list">${Object.entries(state.sessions).map(([k,s])=>`<div><span>${esc(s.title)} · ${Object.keys(s.answers).length}/${s.ids.length}問 · ${s.deadline&&state.settings.timeLimit!==false?'時間制限あり':'時間制限なし'}</span>${btn('続きから',`data-resume="${esc(k)}"`)}${btn('削除',`data-delete-session="${esc(k)}"`)}</div>`).join('')}</div></section>`:''}${sessionTrashPanel()}${timeStudyPanel()}<h3 class="section-title">${DATA.generic?'問題グループ':(state.settings.timeLimit===false?'模試 · 各45問 / 時間制限OFF':'本番形式模試 · 各45問 / 90分')}</h3><div class="grid">${DATA.exams.map(e=>{const aa=state.attempts.filter(a=>a.exam===e.id||a.key===e.id);return `<section class="card"><div class="eyebrow">${e.id}</div><h3>${esc(e.title)}</h3><p class="small muted">${e.questions.length}問 / ${state.sessions[e.id]?(state.sessions[e.id].deadline&&state.settings.timeLimit!==false?'時間制限あり（中断中も進みます）':'時間制限なし'):state.settings.timeLimit===false||e.minutes===0?'時間制限なし':(e.minutes??90)+'分'}</p><p class="muted">${aa.length?`${aa.length}回実施 / 直近 ${pct(aa.at(-1).correct,aa.at(-1).total||45)}`:'未実施'}</p>${btn(state.sessions[e.id]?'続きから':'開始する',`data-start="${e.id}"`,true)}</section>`}).join('')}</div><section class="card settings"><h3>出題の設定</h3><label><input type="checkbox" id="timeLimit" ${state.settings.timeLimit!==false?'checked':''}> 時間制限をONにする（模試・制限時間のある問題グループ）</label><p class="small muted">OFFでは時間切れにならず、中断後も続きから再開できます。OFFで再開すると途中の演習の制限も解除します。ONに戻すと、新しく始める演習から制限時間が付きます。</p><label><input type="checkbox" id="immediateFeedback" ${state.settings.immediateFeedback!==false?'checked':''}> 回答直後に正解・解説を表示</label><label><input type="checkbox" id="shuffleQ" ${state.settings.shuffleQuestions!==false?'checked':''}> 問題順を毎回シャッフル</label><label><input type="checkbox" id="shuffleO" ${state.settings.shuffleOptions!==false?'checked':''}> 選択肢を毎回シャッフル</label><label ${DATA.generic?'class="hidden"':''}><input type="checkbox" id="reserveM4" ${state.settings.reserveM4!==false?'checked':''}> 模試4を通常の復習・ランダム抽出から取り置く</label><p class="small muted">設定は新しく始める演習に適用します。即時解説では最初の回答を記録します。回答ごとに成績へ反映し、提出時に二重計上しません。途中再開時は同じ順番を維持します。${DATA.generic?'問題IDは追加したJSONと共通です。':'問題IDは冊子と共通です。取り置いていても模試4そのものは開始できます。'}</p></section><div class="notice">${DATA.generic?esc(DATA.description||'追加した教材です。問題・解説の内容は作成元で確認してください。'):'共通前提：PySpark 3.5.x、必要な関数・型はimport済み、ANSI=false・UTC。Spark上での全コード実行検証は未実施です。'} 学習指標は合格判定ではありません。</div>`;

for(const a of attempts){for(const id of a.ids){const q=Q[id],ans=a.answers[id],ok=ans===q.correct,first=a.exposedBefore?.[id]===false;highWrong+=ans!==undefined&&!ok&&a.confidence?.[id]==='high';lowRight+=ok&&a.confidence?.[id]==='low';const key=q.concept||q.domain;concept[key]??={label:q.concept_label||q.topic,domain:q.domain,n:0,c:0,w:0,b:0,ids:new Set()};const t=concept[key];t.n++;t.c+=ok;t.w+=ans!==undefined&&!ok;t.b+=ans===undefined;t.ids.add(id);if(ans!==undefined&&!ok&&Object.prototype.hasOwnProperty.call(a.causes||{},id)){const cause=a.causes[id];causeCounts[cause]=(causeCounts[cause]||0)+1;}}}

app.innerHTML=`<h2>弱点・定着の分析</h2><p class="muted">比率と一緒に解答数・問題数を表示します。同じ問題の反復は初見と分けて判断してください。</p><div class="metrics"><div><b>${pct(firstC,firstN)}</b><span>初見 ${firstC}/${firstN}</span></div><div><b>${pct(repeatC,repeatN)}</b><span>既出 ${repeatC}/${repeatN}</span></div><div><b>${highWrong}</b><span>自信ありの誤答</span></div><div><b>${lowRight}</b><span>勘・不明で正解</span></div></div><p class="small muted">初見不明の旧記録：${unknownC}/${unknownN}。未表示の未解答は初見・既出に含めません。</p>${progressPanel(attempts)}<section class="card"><h3>分野別</h3>${Object.entries(domain).map(([d,x])=>`<div class="bar-row"><span>${esc(d)}</span><div class="bar"><i style="width:${x.c/x.n*100}%"></i></div><b>${pct(x.c,x.n)}</b><small>${x.c}/${x.n}回・${x.ids.size}問</small></div>`).join('')||'<p>まだ学習記録がありません。</p>'}</section><section class="card"><h3>論点別の弱点</h3><div class="table-wrap"><table><thead><tr><th>論点</th><th>正答</th><th>誤答 / 未解答</th><th>異なる問題数</th><th></th></tr></thead><tbody>${Object.entries(concept).sort((a,b)=>a[1].c/a[1].n-b[1].c/b[1].n).map(([key,x])=>`<tr><td>${esc(x.label)}</td><td>${x.c}/${x.n} (${pct(x.c,x.n)})</td><td>${x.w} / ${x.b}</td><td>${x.ids.size}</td><td>${btn('練習',`data-concept-practice="${esc(key)}"`)}</td></tr>`).join('')}</tbody></table></div></section><div class="two-col"><section class="card"><h3>自信度と正誤</h3><table><thead><tr><th>自信度</th><th>正答 / 回答</th></tr></thead><tbody>${conf.map(x=>`<tr><td>${LABELS[x.c]}</td><td>${x.right}/${x.n} (${pct(x.right,x.n)})</td></tr>`).join('')}</tbody></table></section><section class="card"><h3>本人が記録した誤答原因</h3>${Object.entries(causeCounts).map(([k,n])=>`<p>${CAUSE_LABEL[k]||'未分類'} <b>${n}回</b></p>`).join('')||'<p>まだ原因の記録がありません。</p>'}<p class="small muted">原因未記録 ${st.totals.wrong-Object.values(causeCounts).reduce((a,b)=>a+b,0)}件。解説画面で原因を選べます。自動推定だけではここへ分類しません。</p></section></div><section class="card"><h3>繰り返した誤解の候補</h3>${Object.values(recurring).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n).slice(0,12).map(x=>`<p><b>${esc(x.concept)} · ${x.n}回 / ${x.ids.size}問</b><br>${esc(x.label)}</p>`).join('')||'<p>同じ誤解候補が2回以上現れた記録はありません。</p>'}<p class="small muted">選択肢のタグからの候補です。本人の原因記録とは別です。</p></section><section class="card"><h3>問題ごとの記録・復習予定</h3><div class="toolbar"><select id="statFilter"><option value="all">受験済み全問</option><option value="wrong">誤答経験あり</option><option value="due">復習期限</option><option value="mastered">定着確認</option></select><select id="statLimit" aria-label="表示件数"><option value="25">25件表示</option><option value="50">50件表示</option><option value="999">全件表示</option></select><input id="statSearch" placeholder="問題ID・論点で検索" aria-label="記録検索"></div><div id="questionStats"></div><p class="small muted">間隔は1→3→7→14→30日が目安。同じ日に繰り返しても段階を進めません。誤答・低自信度では早めに戻します。20時間以上空けた正解で段階を進めます。定着確認は間隔を空けた正解の記録で判断し、合格確率ではありません。回答時間のみで理解不足を判定しません。</p></section>`;
app.querySelectorAll('[data-concept-practice]').forEach(b=>b.onclick=()=>startSelection('priority',10,{concept:b.dataset.conceptPractice,recallFirst:true}));const render=()=>{const f=$('#statFilter').value,search=$('#statSearch').value.toLowerCase();const filtered=qv.filter(([id,x])=>(f==='all'||f==='wrong'&&x.wrong>0||f==='due'&&x.dueAt&&x.dueAt<=Date.now()||f==='mastered'&&x.mastery==='mastered')&&(`${id} ${Q[id].concept_label} ${Q[id].topic}`).toLowerCase().includes(search)).sort((a,b)=>(b[1].priority||0)-(a[1].priority||0));$('#questionStats').innerHTML=`<p class="small muted">${filtered.length}件中 ${Math.min(filtered.length,Number($('#statLimit').value))}件を表示</p><div class="table-wrap"><table><thead><tr><th>問題 / 論点</th><th>誤答 / 回答</th><th>連続正解</th><th>間隔後の正解</th><th>平均時間</th><th>次回</th><th>状態 / 優先理由</th></tr></thead><tbody>${filtered.slice(0,Number($('#statLimit').value)).map(([id,x])=>`<tr><td>${id}<br><small>${esc(Q[id].concept_label||Q[id].topic)}</small></td><td>${x.wrong||0}/${x.answered||0}<br><small>未解答${x.unanswered||0}</small></td><td>${x.streak||0}</td><td>${x.delayedCorrect||0}</td><td>${secs(x.avgSeconds)}</td><td>${date(x.dueAt)}</td><td>${esc(({mastered:'定着確認',learning:'学習中',relearning:'再学習',seen:'表示済み',unseen:'未学習'})[x.mastery]||x.mastery||'学習中')}<br><small>${esc((x.reasons||[]).join('・'))}</small></td></tr>`).join('')}</tbody></table></div>`;};$('#statFilter').onchange=render;$('#statLimit').onchange=render;$('#statSearch').oninput=render;render();}

age.getItem(KEY)||localStorage.getItem(OLDKEY)||'{}','spark-original-record.json');if($('#recoverStorage'))$('#recoverStorage').onclick=()=>{try{localStorage.setItem('spark-study-recovery-'+Date.now(),localStorage.getItem(KEY)||localStorage.getItem(OLDKEY)||'{}');StudyLibrary.recover();storageBlocked=false;save();records();notice('元データを別キーに残し、新しい保存を開始しました。');}catch(e){notice('保存容量が足りません。先に元データを取り出してください。');}};}

  controls.setAttribute('aria-label','演習の表示設定');
  controls.hidden=true;
  controls.innerHTML=`<div class="study-display-bar"><button id="studyDisplayToggle" type="button" aria-pressed="false">集中表示</button><button id="studyDisplayAside" type="button">問題一覧・提出</button><details id="studyReadingDetails"><summary>文字・行間</summary><div class="study-reading-settings"><label>文字サイズ<select id="studyReadingSize"><option value="0">標準</option><option value="18">大きめ · 18px</option><option value="20">大 · 20px</option><option value="22">特大 · 22px</option></select></label><label>行間<select id="studyReadingLine"><option value="0">標準</option><option value="1.85">ゆったり · 1.85</option><option value="2.05">広め · 2.05</option><option value="2.25">さらに広め · 2.25</option></select></label><label>本文の幅<select id="studyReadingWidth"><option value="0">標準</option><option value="760">狭め · 最大760px</option><option value="960">広め · 最大960px</option></select></label><button id="studyReadingReset" type="button">表示設定を標準に</button></div><p class="study-reading-caption">この端末に保存します。スマホでは画面幅に合わせます。集中表示は上の「集中表示を解除」で戻せます。</p><p id="studyReadingSaveStatus" class="study-reading-caption" role="status"></p></details></div>`;
  app.before(controls);
  const toggle=controls.querySelector('#studyDisplayToggle');
  const size=controls.querySelector('#studyReadingSize'),line=controls.querySelector('#studyReadingLine'),width=controls.querySelector('#studyReadingWidth');
  function apply(){
    const running=!!app.querySelector('.question-card');
    controls.hidden=!running;
    document.body.classList.toggle('study-display-session',running);
    document.body.classList.toggle('study-focus',running&&prefs.focus);
    document.body.classList.toggle('study-custom-size',running&&prefs.size!==0);
    document.body.classList.toggle('study-custom-line',running&&prefs.line!==0);
    document.body.classList.toggle('study-custom-width',running&&prefs.width!==0);
    document.body.style.setProperty('--study-reader-font',(prefs.size||17)+'px');
    document.body.style.setProperty('--study-reader-line',String(prefs.line||1.85));
    document.body.style.setProperty('--study-reader-width',(prefs.width||960)+'px');
    toggle.textContent=prefs.focus?'集中表示を解除':'集中表示';
    toggle.setAttribute('aria-pressed',String(prefs.focus));
    size.value=String(prefs.size);line.value=String(prefs.line);width.value=String(prefs.width);
  }
  function save(){
    const status=controls.querySelector('#studyReadingSaveStatus');
    try{localStorage.setItem(key,JSON.stringify(prefs));status.textContent='';}
    catch{status.textContent='表示設定を保存できませんでした。このページを開いている間は適用されます。';}
    apply();
  }
  toggle.onclick=()=>{prefs.focus=!prefs.focus;save();};
  size.onchange=()=>{prefs.size=Number(size.value);save();};
  line.onchange=()=>{prefs.line=Number(line.value);save();};
  width.onchange=()=>{prefs.width=Number(width.value);save();};
  controls.querySelector('#studyReadingReset').onclick=()=>{prefs={...defaults};save();};
  controls.querySelector('#studyDisplayAside').onclick=()=>{
    const aside=app.querySelector('.main>aside');
    if(aside){aside.setAttribute('tabindex','-1');aside.focus({preventScroll:true});aside.scrollIntoView({block:'start',behavior:'smooth'});}
  };
  // Only observe replacement of the app view. Timer ticks and answer-control events need no interception.
  const observer=new MutationObserver(apply);
  observer.observe(app,{childList:true});
  if(typeof ResizeObserver!=='undefined'){
    const sizeObserver=new ResizeObserver(()=>{document.body.style.setProperty('--study-display-offset',(Math.ceil(controls.getBoundingClientRect().height)+16)+'px');});
    sizeObserver.observe(controls);
  }
  window.addEventListener('storage',event=>{if(event.key===key){try{prefs=clean(JSON.parse(event.newValue||'null'));apply();}catch{}}});
  apply();
})();
</script>
<script src="firebase-config.js"></script>
<script src="firebase-storage.js"></script>
<script>/* Automatic library synchronization. Local records remain usable offline. */
(function(){
'use strict';
const config=globalThis.SPARK_FIREBASE_CONFIG,configured=!!((config?.ownerEmail||config?.ownerEmailSha256)&&['apiKey','authDomain','projectId','appId'].every(k=>config.firebase?.[k]));
let issue='',lastSyncAt=null;
let adapter,user,busy=false,epoch=0,timer,base=null,message='端末に自動保存中。ログインすると問題集と履歴を自動同期します。',connecting;
const panel=document.createElement('details');panel.id='cloudPanel';panel.className='card';
panel.innerHTML='<summary id="cloudSummary">ログイン・自動保存</summary><p id="cloudStatus" role="status" aria-live="polite"></p><p id="cloudLastSync" class="small muted"></p><div class="toolbar"><button id="cloudLogin">Googleでログイン</button><button id="cloudSave">今すぐ同期</button><button id="cloudLoad">クラウドから同期</button><button id="cloudLogout">ログアウト</button><button id="cloudBackup">同期前のバックアップを保存</button></div><p class="small muted">ログイン時・回答後・画面に戻った時に自動同期します。通信できない間は端末に保存し、再接続時に再試行します。通常はバックグラウンドで保存します。端末を替える前に確かめたい場合は「今すぐ同期」を押してください。同じ演習を複数端末で同時に進めた場合は別の途中セッションとして保持します。</p>';
document.querySelector('#app').before(panel);
const find=id=>panel.querySelector('#'+id);
function setText(id,value){const node=find(id);if(node.textContent!==value)node.textContent=value;}
function showLastSync(){setText('cloudLastSync',lastSyncAt?'最終同期：'+lastSyncAt.toLocaleString('ja-JP'):'最終同期：このページではまだ完了していません。');}
panel.addEventListener('toggle',()=>{if(panel.open)showLastSync();});
function render(){
 setText('cloudSummary',issue?'ログイン・自動保存（要確認）':'ログイン・自動保存');
 setText('cloudStatus',!configured?'Firebase未設定：端末内で利用できます。':issue||(user?'ログイン中：'+user.email+'。問題集と履歴は自動で保存されます。':'未ログイン。端末に保存中です。ログインすると他の端末と自動同期します。'));
 find('cloudLogin').disabled=busy||!!user||!configured;
 for(const id of ['cloudSave','cloudLoad','cloudLogout'])find(id).disabled=busy||!user;
}
function baseKey(){return 'study-cloud-base:'+config.firebase.projectId+':'+user.uid;}
function schedule(delay=2500){if(!user||timer)return;message='未同期の変更があります。自動同期を待っています。';render();timer=setTimeout(()=>{timer=null;sync();},delay);}
function applySnapshot(next){
 const incoming=next.banks[StudyLibrary.active]?.state;if(!incoming)throw Error('使用中の問題集が見つかりません');
 StudyLibrary.accept(next);refreshBankList();
 if(StudyLibrary.equal(E.normalizeState(state),incoming))return;
 // Keep event-handler references to a live session intact while merging.
 const live=activeKey&&state.sessions[activeKey],newLive=activeKey&&incoming.sessions[activeKey];
 state=E.normalizeState(incoming);
 if(live&&newLive&&live.id===newLive.id){Object.keys(live).forEach(k=>delete live[k]);Object.assign(live,newLive);state.sessions[activeKey]=live;}
 if(activeKey){if(!state.sessions[activeKey]){activeKey=null;timing=null;view='home';home();}else if(!document.activeElement?.matches('textarea,input[type=text]'))renderQuestion();}
 else if(!document.activeElement?.matches('textarea,input[type=text]'))({home,study,analytics,history,drills,records,english:englishDashboard}[view]||home)();
}
async function sync(){
 clearTimeout(timer);timer=null;if(!adapter||!user||busy)return;
 if(storageBlocked||StudyLibrary.error){issue='端末の保存エラーを先に解消してください。';render();return;}
 busy=true;render();const token=epoch;
 try{
  tickTime();StudyLibrary.capture(state);
  for(let retry=0;retry<3;retry++){
   const remote=await adapter.read();if(token!==epoch)throw Error('ログイン状態が変わりました');
   const local=StudyLibrary.snapshot(),remoteValue=remote.text?StudyLibrary.normalize(JSON.parse(remote.text)):local;
   const result=remote.text?StudyLibrary.merge(base,local,remoteValue):{value:local,conflicts:0};
   // Keep both sides before applying a merge. Never put backups in the public repository.
   if(!StudyLibrary.equal(local,result.value)||result.conflicts)localStorage.setItem('study-sync-backup',JSON.stringify({local,remote:remoteValue,at:new Date().toISOString()}));
   try{if(!remote.text||!StudyLibrary.equal(result.value,remoteValue))await adapter.write(JSON.stringify(result.value),remote.revision);}
   catch(e){if(e.code==='study/conflict'&&retry<2)continue;throw e;}
   if(token!==epoch)throw Error('ログイン状態が変わりました');
   // Changes made while the network request was running must not be overwritten.
   StudyLibrary.capture(state);const latest=StudyLibrary.snapshot();
   const final=StudyLibrary.equal(local,latest)?result.value:StudyLibrary.merge(local,latest,result.value).value;
   applySnapshot(final);base=result.value;localStorage.setItem(baseKey(),JSON.stringify(base));
   const pending=!StudyLibrary.equal(final,result.value);
   lastSyncAt=new Date();issue=result.conflicts?'同時編集を検出しました。別端末の途中演習または同期前バックアップも確認してください。':'';
   message='同期済み（'+new Date().toLocaleTimeString('ja-JP')+'）。'+(result.conflicts?'同時編集を検出しました。別端末の途中演習または同期前バックアップも確認できます。':'問題集と履歴をクラウドに保持しています。');
   if(pending){message='保存中の追加操作を次に同期します。';timer=setTimeout(()=>{timer=null;sync();},1200);}return;
  }
 }catch(e){issue='未同期：'+(e.code||e.message)+'。端末の記録は保持しています。接続回復後に再試行します。';}
 finally{busy=false;render();}
}
async function connect(){
 if(!configured||!/^https?:$/.test(location.protocol))return;
 if(!connecting)connecting=SparkFirebase.connect(config,(next,error)=>{
  epoch++;user=next;base=null;lastSyncAt=null;issue=error||'';
  if(user){try{const saved=localStorage.getItem(baseKey());base=saved?StudyLibrary.normalize(JSON.parse(saved)):null;}catch{/* A missing baseline is safe: histories are unioned. */}schedule(50);}
  else{clearTimeout(timer);timer=null;message=error||'端末に保存中。ログインすると自動同期します。';render();}
 }).then(value=>{adapter=value;if(user)schedule(50);return value;}).catch(e=>{connecting=null;issue='接続できません：'+e.message;render();throw e;});
 return connecting;
}
find('cloudLogin').onclick=async()=>{try{if(!/^https?:$/.test(location.protocol))throw Error('ログインにはHTTPSの公開URLまたはlocalhostが必要です');await connect();await adapter.login();}catch(e){issue=e.message;render();}};
find('cloudLogout').onclick=async()=>{try{await sync();await adapter.logout();}catch(e){issue=e.message;render();}};
async function manualSync(){await sync();showLastSync();}
find('cloudSave').onclick=manualSync;find('cloudLoad').onclick=manualSync;
find('cloudBackup').onclick=()=>{const raw=localStorage.getItem('study-sync-backup');if(raw)download(JSON.parse(raw),'同期前バックアップ.json');else{setText('cloudLastSync','同期による変更前のバックアップはまだありません。');}};
window.addEventListener('study-saved',()=>schedule());
window.addEventListener('online',()=>schedule(50));window.addEventListener('focus',()=>{if(user)schedule(100);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&user)schedule(100);});
setInterval(()=>{if(user&&!document.hidden&&!busy)sync();},30000);
render();connect().catch(()=>{});
})();
</script>
