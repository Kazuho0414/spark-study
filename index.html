<script>/* Spark learning engine. All answers use canonical indexes; display order is separate.
 * Scheduling and priority are learning heuristics, not a prediction of passing. */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.LearningEngine = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  const DAY = 86400000, SPACED = 20 * 3600000;
  const DOMAINS = [
    {key:'Architecture',label:'Architecture',weight:.20,quota:9},
    {key:'Spark SQL',label:'Spark SQL',weight:.20,quota:9},
    {key:'DataFrame',label:'DataFrame',weight:.30,quota:14},
    {key:'Tuning',label:'Tuning',weight:.10,quota:4},
    {key:'Structured Streaming',label:'Structured Streaming',weight:.10,quota:5},
    {key:'Spark Connect',label:'Spark Connect',weight:.05,quota:2},
    {key:'Pandas API',label:'Pandas API',weight:.05,quota:2}
  ];
  const CAUSES = [
    {key:'knowledge',label:'知識不足'}, {key:'api',label:'APIの混同'},
    {key:'reading',label:'コード・条件の読み違い'}, {key:'english',label:'英語の条件見落とし'},
    {key:'boundary',label:'NULL・境界条件'}, {key:'time',label:'時間不足'},
    {key:'careless',label:'操作・確認ミス'}, {key:'unknown',label:'未分類'}
  ];
  const CONFIDENCE = ['high','medium','low','unknown'];
  const BAD_KEYS = new Set(['__proto__','prototype','constructor']);
  const copy = x => JSON.parse(JSON.stringify(x));
  const own = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
  const finite = x => typeof x === 'number' && Number.isFinite(x);
  const fail = message => {throw new Error('学習記録が不正です: '+message);};
  const plain = x => !!x && typeof x === 'object' && !Array.isArray(x) && (Object.getPrototypeOf(x) === Object.prototype || Object.getPrototypeOf(x) === null);
  function obj(x,label) {if(!plain(x))fail(label+'はオブジェクトが必要です');return x;}
  function safeKey(k) {if(typeof k!=='string'||!k||k.length>300||BAD_KEYS.has(k))fail('不正な識別子');return k;}
  function number(x,label,min=0,max=Number.MAX_SAFE_INTEGER) {if(!finite(x)||x<min||x>max)fail(label+'の値');return x;}
  function dateMs(x,label) {const n=typeof x==='string'?Date.parse(x):NaN;if(!finite(n))fail(label+'の日付');return n;}
  function shuffle(items) {const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  function stableHash(s) {let n=2166136261;for(let i=0;i<s.length;i++){n^=s.charCodeAt(i);n=Math.imul(n,16777619);}return (n>>>0).toString(36);}
  let serial=0;
  function uid(prefix,now) {return prefix+'-'+now.toString(36)+'-'+(++serial).toString(36)+'-'+Math.random().toString(36).slice(2,10);}
  function makeEngine(DATA) {
    const questionMap={}, examMap={};
    const allQuestions=[];
    for(const e of DATA.exams||[]) {
      safeKey(e.id); if(own(examMap,e.id))fail('教材の模試IDが重複しています');
      examMap[e.id]=e;
      for(const q of e.questions||[])addQuestion(q);
    }
    for(const q of DATA.variants||[])addQuestion(q);
    for(const q of DATA.additional||[])addQuestion(q);
    function addQuestion(q) {
      safeKey(q.id);if(own(questionMap,q.id))fail('教材の問題IDが重複しています: '+q.id);
      if(!Array.isArray(q.options)||q.options.length<2||!Number.isInteger(q.correct)||q.correct<0||q.correct>=q.options.length)fail('教材の選択肢が不正です: '+q.id);
      questionMap[q.id]=q;allQuestions.push(q);
    }
    const drillIds=new Set((DATA.drills||[]).map(d=>d.id));
    const emptyState=()=>({version:2,attempts:[],sessions:{},drills:{},exposures:{},settings:{}});
    function ids(raw,label) {
      if(!Array.isArray(raw)||!raw.length||raw.length>allQuestions.length)fail(label+'の問題一覧');
      const a=raw.map(id=>{safeKey(id);if(!own(questionMap,id))fail('この教材にない問題: '+id);return id;});
      if(new Set(a).size!==a.length)fail(label+'の問題が重複しています');return a;
    }
    function map(raw,allowed,label,check) {
      const out={},source=raw===undefined?{}:raw;obj(source,label);const allowedSet=new Set(allowed);
      for(const [id,value] of Object.entries(source)) {safeKey(id);if(!allowedSet.has(id))fail(label+'に範囲外の問題があります');out[id]=check(value,id);}
      return out;
    }
    function answerMap(raw,a) {return map(raw,a,'回答',(v,id)=>{if(!Number.isInteger(v)||v<0||v>=questionMap[id].options.length)fail('選択肢の番号: '+id);return v;});}
    function boolMap(raw,a,label,nullable=false) {return map(raw,a,label,v=>{if(typeof v!=='boolean'&&!(nullable&&v===null))fail(label+'の値');return v;});}
    function cleanOrders(raw,a) {
      obj(raw,'選択肢順');const out={};
      for(const id of a) {
        const n=questionMap[id].options.length,o=raw[id];
        if(!Array.isArray(o)||o.length!==n||new Set(o).size!==n||o.some(x=>!Number.isInteger(x)||x<0||x>=n))fail('選択肢順: '+id);
        out[id]=o.slice();
      }
      for(const id of Object.keys(raw))if(!a.includes(id))fail('選択肢順に範囲外の問題');
      return out;
    }
    function cleanCommon(raw,a) {
      if(raw.immediateFeedback!==undefined&&typeof raw.immediateFeedback!=='boolean')fail('即時解説の設定');
      return {
        ...(raw.immediateFeedback===undefined?{}:{immediateFeedback:raw.immediateFeedback}),
        ids:a,optionOrders:cleanOrders(raw.optionOrders,a),answers:answerMap(raw.answers,a),
        confidence:map(raw.confidence,a,'自信度',v=>{if(!CONFIDENCE.includes(v))fail('自信度の値');return v;}),
        flags:boolMap(raw.flags,a,'要復習'),
        timesMs:map(raw.timesMs,a,'回答時間',v=>number(v,'回答時間',0,365*DAY)),
        notes:map(raw.notes,a,'メモ',v=>{if(typeof v!=='string'||v.length>20000)fail('メモの形式');return v;}),
        shown:map(raw.shown,a,'表示記録',v=>{if(v===true)return v;return number(v,'表示日時');}),
        exposedBefore:boolMap(raw.exposedBefore,a,'初見記録',true),
        choicesRevealed:boolMap(raw.choicesRevealed,a,'選択肢表示'),
        causes:map(raw.causes,a,'誤答原因',v=>{if(!CAUSES.some(c=>c.key===v))fail('誤答原因');return v;})
      };
    }
    function cleanSettings(raw) {
      const source=raw===undefined?{}:raw;obj(source,'設定');const out={};
      for(const [k,v] of Object.entries(source)) {
        safeKey(k);
        if(k.startsWith('flag:')&&(!own(questionMap,k.slice(5))||typeof v!=='boolean'))fail('要復習マークの設定');
        if(typeof v==='boolean'||(finite(v)&&Math.abs(v)<1e12)||(typeof v==='string'&&v.length<=1000))out[k]=v;
        else fail('設定の形式');
      }
      return out;
    }
    function cleanDrills(raw) {
      const source=raw===undefined?{}:raw;obj(source,'補強演習');const out={};
      for(const [k,v] of Object.entries(source)) {safeKey(k);if(!drillIds.has(k))fail('この教材にない補強演習: '+k);if(typeof v!=='boolean')fail('補強演習の記録');out[k]=v;}
      return out;
    }
    function normalizeState(input) {
      obj(input,'学習記録');
      if(input.version!==undefined&&input.version!==1&&input.version!==2)fail('未対応バージョン');
      if(!Array.isArray(input.attempts)||input.attempts.length>100000)fail('受験履歴');
      obj(input.sessions,'途中の解答');
      if(input.version!==2)return migrateLegacy(input);
      const result=emptyState(), seenAttemptIds=new Set();
      for(const raw of input.attempts) {
        obj(raw,'受験履歴');safeKey(raw.id);if(seenAttemptIds.has(raw.id))fail('受験IDの重複');seenAttemptIds.add(raw.id);
        const a=ids(raw.ids,'受験履歴'),common=cleanCommon(raw,a),date=dateMs(raw.date,'受験');
        if(typeof raw.auto!=='boolean')fail('自動提出の値');
        const correct=a.filter(id=>common.answers[id]===questionMap[id].correct).length;
        if(raw.correct!==undefined&&raw.correct!==correct)fail('正答数が回答と一致しません');
        if(raw.total!==undefined&&raw.total!==a.length)fail('総問題数が一致しません');
        const r={...common,id:raw.id,key:typeof raw.key==='string'?safeKey(raw.key):raw.id,exam:typeof raw.exam==='string'?safeKey(raw.exam):undefined,
          mode:typeof raw.mode==='string'?raw.mode.slice(0,100):'exam',title:typeof raw.title==='string'?raw.title.slice(0,500):'演習',
          date:new Date(date).toISOString(),correct,total:a.length,auto:raw.auto,elapsedSeconds:number(raw.elapsedSeconds,'経過時間',0,365*86400),
          recallFirst:raw.recallFirst===true,legacy:raw.legacy===true};
        if(raw.started!==undefined)r.started=number(raw.started,'開始日時');
        result.attempts.push(r);
      }
      for(const [key,raw] of Object.entries(input.sessions)) {
        safeKey(key);obj(raw,'途中の解答');const a=ids(raw.ids,'途中の解答'),common=cleanCommon(raw,a);
        if(!Number.isInteger(raw.pos)||raw.pos<0||raw.pos>=a.length)fail('表示位置');
        const started=number(raw.started,'開始日時'),deadline=raw.deadline===null?null:number(raw.deadline,'終了予定時刻');
        if(deadline!==null&&deadline<started)fail('制限時間');
        safeKey(raw.id);if(raw.key!==key)fail('途中の解答キーが一致しません');
        result.sessions[key]={...common,id:raw.id,key,mode:typeof raw.mode==='string'?raw.mode.slice(0,100):'exam',title:typeof raw.title==='string'?raw.title.slice(0,500):'演習',
          pos:raw.pos,started,deadline,recallFirst:raw.recallFirst===true};
      }
      obj(input.exposures,'表示履歴');
      for(const [id,raw] of Object.entries(input.exposures)) {
        if(!own(questionMap,id))fail('表示履歴の問題');obj(raw,'表示履歴');
        const firstAt=number(raw.firstAt,'初回表示'),lastAt=number(raw.lastAt,'最終表示');
        if(lastAt<firstAt||!Number.isInteger(raw.count)||raw.count<1||raw.count>1e9)fail('表示履歴の値');
        result.exposures[id]={firstAt,lastAt,count:raw.count};
      }
      result.drills=cleanDrills(input.drills);result.settings=cleanSettings(input.settings);

    }
    function migrateLegacy(input) {
      const result=emptyState(),known=new Set(),signatures={};
      for(const raw of input.attempts.slice().sort((x,y)=>Date.parse(x&&x.date)-Date.parse(y&&y.date))) {
        obj(raw,'旧受験履歴');const e=examMap[raw.exam];if(!e)fail('旧履歴の模試ID');
        const a=e.questions.map(q=>q.id),answers=answerMap(raw.answers,a),flags=boolMap(raw.flags,a,'要復習');
        const at=dateMs(raw.date,'旧受験');if(typeof raw.auto!=='boolean')fail('旧履歴の自動提出');
        const canonicalAnswers={};for(const id of a)if(own(answers,id))canonicalAnswers[id]=answers[id];
        const signature=stableHash(JSON.stringify({exam:raw.exam,date:new Date(at).toISOString(),answers:canonicalAnswers}));
        const occurrence=signatures[signature]=(signatures[signature]||0)+1;
        const r={id:'legacy-'+signature+'-'+occurrence,key:e.id,exam:e.id,mode:'exam',title:e.title,ids:a,optionOrders:{},answers,flags,
          confidence:{},timesMs:{},notes:{},shown:{},exposedBefore:{},choicesRevealed:{},causes:{},legacy:true,recallFirst:false,
          date:new Date(at).toISOString(),correct:a.filter(id=>answers[id]===questionMap[id].correct).length,total:a.length,
          auto:raw.auto,elapsedSeconds:number(raw.elapsedSeconds,'旧経過時間',0,365*86400)};
        if(raw.correct!==undefined&&raw.correct!==r.correct)fail('旧正答数が回答と一致しません');
        for(const id of a) {
          r.optionOrders[id]=questionMap[id].options.map((_,i)=>i);
          r.exposedBefore[id]=known.has(id)?true:null;
          if(own(answers,id)) {r.shown[id]=true;known.add(id);const old=result.exposures[id];result.exposures[id]={firstAt:old?Math.min(old.firstAt,at):at,lastAt:old?Math.max(old.lastAt,at):at,count:(old?old.count:0)+1};}
        }
        result.attempts.push(r);
      }

:''}> 問題順を毎回シャッフル</label><label><input type="checkbox" id="shuffleO" ${state.settings.shuffleOptions!==false?'checked':''}> 選択肢を毎回シャッフル</label><label><input type="checkbox" id="reserveM4" ${state.settings.reserveM4!==false?'checked':''}> 模試4を通常の復習・ランダム抽出から取り置く</label><p class="small muted">設定は新しく始める演習に適用します。即時解説では最初の回答を記録し、自信度は選択肢を選ぶ前に設定します。途中再開時は同じ順番を維持します。問題IDは冊子と共通です。取り置いていても模試4そのものは開始できます。</p></section><div class="notice">共通前提：PySpark 3.5.x、必要な関数・型はimport済み、ANSI=false・UTC。Spark上での全コード実行検証は未実施です。学習指標は合格判定ではありません。</div>`;
$('#todayBtn').onclick=()=>startSelection(due?'due':'priority',20);$('#wrongBtn').onclick=()=>startSelection('wrong',20);$('#menuBtn').onclick=()=>navigate('study');if($('#additionalHomeBtn'))$('#additionalHomeBtn').onclick=()=>startAdditional();
app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startMock(b.dataset.start));bindResume();
for(const [id,key]of [['immediateFeedback','immediateFeedback'],['shuffleQ','shuffleQuestions'],['shuffleO','shuffleOptions'],['reserveM4','reserveM4']])$('#'+id).onchange=e=>{state.settings[key]=e.target.checked;save();};}
function bindResume(){app.querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>resume(b.dataset.resume));}
function allowedIds(ids,kind){return ids.filter(id=>!state.settings.reserveM4||kind==='wrong'||kind==='due'||kind==='flagged'||!id.startsWith('M4-')||state.exposures[id]);}
function startMock(id){if(state.sessions[id])return resume(id);const exam=DATA.exams.find(e=>e.id===id);begin({key:id,mode:'mock',title:exam.title,ids:exam.questions.map(q=>q.id),minutes:90});}
function begin(config){if(!config.ids.length){notice('条件に合う問題はありません。別の条件を選んでください。');return;}leave();const s=E.newSession(state,{...config,shuffleQuestions:state.settings.shuffleQuestions!==false,shuffleOptions:state.settings.shuffleOptions!==false,immediateFeedback:state.settings.immediateFeedback!==false});if(config.mode==='mock')s.exam=config.key;save();resume(config.key);}
function resume(key){leave();if(!state.sessions[key])return;activeKey=key;view='session';notice('');const s=state.sessions[key];if(s.deadline&&s.deadline<=Date.now()){submit(true);return;}renderQuestion();clockTick();}
function startSelection(kind,count,filter={}){state.settings.reserveM4??=true;const extra=['highwrong','guess','unanswered'].includes(kind),st=extra?getStats():null;let all=E.selectQuestions(state,{kind:extra?'priority':kind,count:999,...filter});if(extra)all=all.filter(id=>{const x=st.questions[id];return kind==='highwrong'?x.highConfidenceWrong>0&&x.unresolved:kind==='guess'?x.guessCorrect>0&&x.mastery!=='mastered':x.unanswered>0&&x.answered===0;});const ids=allowedIds(all,kind).slice(0,count);const key=`${kind}-${crypto.randomUUID?.()||Date.now()}`;begin({key,mode:kind,title:MODE[kind]||'学習',ids,minutes:kind==='random'?90:0,recallFirst:!!filter.recallFirst});}
function startAdditional(){const ids=DATA.additional.filter(q=>(!$('#studyDomain')||!$('#studyDomain').value||q.domain===$('#studyDomain').value)&&(!$('#studyConcept')||!$('#studyConcept').value||q.concept===$('#studyConcept').value)).map(q=>q.id);begin({key:'additional-'+Date.now(),mode:'custom',title:'追加問題',ids,recallFirst:!!$('#recallFirst')?.checked});}
function study(){const concepts=[...new Map(E.allQuestions.map(q=>[q.concept||q.domain,{id:q.concept||q.domain,label:q.concept_label||q.domain}])).values()];app.innerHTML=`<h2>復習・ランダム演習</h2><section class="card"><div class="formgrid"><label>分野<select id="studyDomain"><option value="">すべて</option>${DATA.exams.flatMap(e=>e.questions).map(q=>q.domain).filter((d,i,a)=>a.indexOf(d)===i).map(d=>`<option>${esc(d)}</option>`).join('')}</select></label><label>論点<select id="studyConcept"><option value="">すべて</option>${concepts.map(c=>`<option value="${esc(c.id)}">${esc(c.label)}</option>`).join('')}</select></label><label>問題数<select id="studyCount"><option>10</option><option selected>20</option><option>45</option><option value="999">該当する全問</option></select></label></div><p><label><input id="recallFirst" type="checkbox"> 選択肢を見る前に、自分の答えを書く</label></p><div class="toolbar">${[['due','期限が来た問題'],['wrong','未克服の誤答'],['priority','弱点を優先'],['flagged','要復習マーク'],['highwrong','自信ありの誤答'],['guess','勘で正解した問題'],['unanswered','未解答の問題']].map(([k,t])=>btn(t,`data-practice="${k}"`,k==='priority')).join('')}</div><p class="muted small">誤答は選択して間違えた問題です。未解答は別集計し、弱点優先の対象に含めます。条件に合う数だけ出題します。同じ日に正解しても未克服の誤答に残し、20時間以上空けた正解で克服を確認します。</p></section><section class="card"><h3>ランダム模試45問</h3><p>元の180問から公式領域配分に沿って抽出します。既に見た問題を含む場合は初見として集計しません。類題24問と追加問題はこの抽出に混ぜません。</p>${btn('ランダム模試を開始','id="randomBtn"',true)}${DATA.additional.length?btn('追加問題を解く（'+DATA.additional.length+'問）','id="additionalBtn"'):''}<p class="muted small">上の分野・論点・問題数指定はランダム模試には適用しません。</p></section>`;
if($('#additionalBtn'))$('#additionalBtn').onclick=()=>startAdditional();app.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>startSelection(b.dataset.practice,Number($('#studyCount').value),{domain:$('#studyDomain').value||undefined,concept:$('#studyConcept').value||undefined,recallFirst:$('#recallFirst').checked}));$('#randomBtn').onclick=()=>{const ids=E.selectQuestions(state,{kind:'random',count:45,reserveM4:state.settings.reserveM4!==false});begin({key:`random-${Date.now()}`,mode:'random',title:'ランダム模試',ids,minutes:90});};}
function translationPanel(q,order,answer){
  return `<details class="translation-panel" open data-question-id="${q.id}"><summary>問題文・選択肢の日本語訳</summary><h4>問題文</h4><div class="translated-stem">${esc(q.stem_ja)}</div><h4>選択肢 · 解答時と同じ順番</h4><div class="translated-options">${order.map((canonical,i)=>`<div class="translated-option" data-canonical-index="${canonical}" data-display-letter="${'ABCD'[i]}"><b class="translation-letter">${'ABCD'[i]}.</b><div><div class="translated-option-text">${esc(q.options_ja[canonical])}</div>${canonical===q.correct?'<span class="translation-tag good">正解</span>':''}${canonical===answer?'<span class="translation-tag">あなたの回答</span>':''}</div></div>`).join('')}</div><p class="small muted">コード・API名・データ値は原文のままです。</p></details>`;
}
function instantFeedback(s,q,order){
  const answer=s.answers[q.id],right=answer===q.correct;
  return `<section id="instantFeedback" class="instant-feedback ${right?'is-correct':'is-wrong'}" tabindex="-1" aria-label="回答結果と解説"><h3 class="instant-verdict ${right?'good':'bad'}" role="status">${right?'正解です':'不正解です'}</h3><p class="small">あなたの回答：${'ABCD'[order.indexOf(answer)]}</p><p class="instant-correct"><b>正解：${'ABCD'[order.indexOf(q.correct)]}</b><br>${esc(q.options[q.correct])}</p>${translationPanel(q,order,answer)}<div class="explain"><b>解説</b><p>${esc(q.explanation_ja)}</p><b>選択肢ごとの理由</b>${order.map((canonical,i)=>`<p>${'ABCD'[i]}：${esc(q.distractors_ja[canonical])}</p>`).join('')}<a href="${esc(q.source_url)}" target="_blank" rel="noopener">公式資料 ↗</a></div><p class="small muted">最初の回答を記録しています。解説を見た後の選び直しはできません。次の問題へ進み、最後に「提出して採点」で学習結果を確定してください。</p></section>`;
}
function renderQuestion(){
  tickTime();const s=state.sessions[activeKey];if(!s)return navigate('home');
  const q=Q[s.ids[s.pos]];E.markShown(state,s,q.id);
  if(typeof state.settings['flag:'+q.id]==='boolean')s.flags[q.id]=state.settings['flag:'+q.id];
  s.timesMs??={};s.notes??={};s.confidence??={};s.choicesRevealed??={};s.immediateFeedback??=state.settings.immediateFeedback!==false;
  const answered=s.answers[q.id]!==undefined,locked=s.immediateFeedback&&answered;
  save();timing=document.hidden||locked?null:{key:activeKey,id:q.id,at:Date.now()};
  const order=s.optionOrders[q.id]||[0,1,2,3],revealed=answered||!s.recallFirst||s.choicesRevealed[q.id];
  app.innerHTML=`<div class="main"><section class="card question-card"><div class="muted">${esc(s.title)} · ${s.pos+1} / ${s.ids.length} · ${q.id}</div><div class="progress"><div style="width:${Object.keys(s.answers).length/s.ids.length*100}%"></div></div><p class="small muted">${s.immediateFeedback?'選択肢を選ぶと、すぐに正解と解説が表示されます。':'正解と解説は提出後に表示します。'}</p><div class="question">${esc(q.stem)}</div>${s.recallFirst?`<label>選択肢を見る前の答え・理由<textarea id="recallNote" rows="3" placeholder="説明やコードを自分で書いてください">${esc(s.notes[q.id]||'')}</textarea></label>${!revealed?btn('選択肢を表示','id="revealChoices"',true):''}`:''}<div id="choiceArea" ${revealed?'':'class="hidden"'}><fieldset class="confidence" ${locked?'disabled':''}><legend>${s.immediateFeedback?'回答前の自信度（任意）':'回答の自信度'}</legend>${['high','medium','low'].map(c=>`<label><input type="radio" name="confidence" value="${c}" ${s.confidence[q.id]===c?'checked':''}> ${LABELS[c]}</label>`).join('')}</fieldset><form id="answers">${order.map((canonical,i)=>`<label class="option ${s.answers[q.id]===canonical?'chosen':''} ${locked&&canonical===q.correct?'answer-correct':''} ${locked&&canonical===s.answers[q.id]&&canonical!==q.correct?'answer-wrong':''}"><input type="radio" name="answer" value="${canonical}" ${s.answers[q.id]===canonical?'checked':''} ${locked?'disabled':''}><b>${'ABCD'[i]}</b><span>${esc(q.options[canonical])}${locked&&canonical===q.correct?'<strong class="option-tag good">正解</strong>':locked&&canonical===s.answers[q.id]?'<strong class="option-tag bad">あなたの回答</strong>':''}</span></label>`).join('')}</form></div>${locked?instantFeedback(s,q,order):''}<div class="nav"><button id="prev" ${s.pos===0?'disabled':''}>← 前へ</button><button id="flag">${s.flags[q.id]?'★ 要復習を解除':'☆ 要復習にする'}</button><button id="next" class="primary" ${s.pos===s.ids.length-1?'disabled':''}>次へ →</button></div></section><aside class="card"><div class="muted">${s.deadline?'残り時間':'時間制限なし'}</div><div class="timer" id="clock">—</div><p class="small">解答 ${Object.keys(s.answers).length} / ${s.ids.length}<br>オレンジ：要復習</p><details class="question-nav" open><summary>問題一覧</summary><div class="qgrid">${s.ids.map((id,i)=>`<button data-pos="${i}" class="${s.answers[id]!==undefined?'done':''} ${s.pos===i?'active':''} ${s.flags[id]?'flag':''}">${i+1}</button>`).join('')}</div></details><p>${btn('提出して採点','id="submit"',true)}</p><p class="small muted">${s.deadline?'離席中も試験時間は進みます。':'途中保存して後から再開できます。'}問題別の時間は画面が表示されていた時間の目安です。${s.immediateFeedback?'解説を読んでいる時間は問題別の回答時間から除きます。':''}</p></aside></div>`;
  $('#answers').onchange=e=>{if(s.immediateFeedback&&s.answers[q.id]!==undefined)return;tickTime();s.answers[q.id]=Number(e.target.value);if(s.immediateFeedback)timing=null;save();renderQuestion();if($('#instantFeedback')){$('#instantFeedback').focus({preventScroll:true});$('#instantFeedback').scrollIntoView({block:'start',behavior:'smooth'});}};
  app.querySelectorAll('[name=confidence]').forEach(r=>r.onchange=()=>{if(s.immediateFeedback&&s.answers[q.id]!==undefined)return;s.confidence[q.id]=r.value;save();});
  $('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
  $('#flag').onclick=()=>{s.flags[q.id]=!s.flags[q.id];state.settings['flag:'+q.id]=s.flags[q.id];save();renderQuestion();};
  app.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{tickTime();s.pos=Number(b.dataset.pos);timing=null;renderQuestion();});$('#submit').onclick=()=>submit(false);
  if($('#recallNote'))$('#recallNote').oninput=e=>{s.notes[q.id]=e.target.value.slice(0,5000);save();};
  if($('#revealChoices'))$('#revealChoices').onclick=()=>{s.choicesRevealed[q.id]=true;save();renderQuestion();};clockTick();
}
function move(n){const s=state.sessions[activeKey];tickTime();timing=null;s.pos+=n;renderQuestion();$('.question-card')?.scrollIntoView({block:'start',behavior:'smooth'});}
function clockTick(){if(!activeKey)return;const s=state.sessions[activeKey];if(!s)return;if(s.deadline){const n=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));if($('#clock'))$('#clock').textContent=`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;if(n===0)submit(true);}else if($('#clock'))$('#clock').textContent='自由演習';}
setInterval(()=>{tickTime();clockTick();if(activeKey)save();},1000);
function submit(auto){const s=state.sessions[activeKey];if(!s)return;const blanks=s.ids.length-Object.keys(s.answers).length;if(!auto&&!confirm(`提出しますか？ 未解答${blanks}問。提出して学習結果を確定します。`))return;tickTime();timing=null;const a=E.finish(state,activeKey,auto);save();activeKey=null;view='result';showResult(a);if(auto)notice('制限時間になったため自動採点しました。');}
function attemptBreakdown(a){const m={};for(const q of qlist(a)){m[q.domain]??={n:0,c:0};m[q.domain].n++;if(a.answers[q.id]===q.correct)m[q.domain].c++;}return m;}
function reasonControls(a,q){const answer=a.answers[q.id],wrong=answer!==undefined&&answer!==q.correct;const suggestion=wrong?(q.suggested_causes?.[answer]||'unknown'):'unknown';const value=a.causes?.[q.id]||'unknown';return `<div class="review-tools">${wrong?`<p><b>考え違いの候補：</b>${esc(q.misconception_tags?.[answer]||q.distractors_ja[answer])}<br><span class="muted small">選択した誤答からの候補です。原因の断定ではありません。</span></p><label>実際に間違えた原因<select data-cause="${q.id}">${Object.entries(CAUSE_LABEL).map(([k,t])=>`<option value="${k}" ${value===k?'selected':''}>${t}</option>`).join('')}</select></label>${!a.causes?.[q.id]&&suggestion!=='unknown'?btn(`候補「${CAUSE_LABEL[suggestion]}」を採用`,`data-suggest="${q.id}" data-value="${suggestion}"`):''}`:answer===undefined?'<p class="muted">未解答です。誤答原因は推定しません。</p>':''}<label>次回の自分へのメモ<textarea data-note="${q.id}" rows="2" placeholder="判断に必要だった条件・見落とした点">${esc(a.notes?.[q.id]||'')}</textarea></label><div class="toolbar">${btn('この問題を再テスト',`data-retry-one="${q.id}"`)}${btn('同じ論点の別問題',`data-similar="${q.id}"`)}${btn(isFlagged(q.id)?'★ 要復習を解除':'☆ 要復習にする',`data-review-flag="${q.id}"`)}</div></div>`;}
function reviewList(a,filter='needs'){const st=getStats();return qlist(a).filter(q=>{const ans=a.answers[q.id],wrong=ans!==undefined&&ans!==q.correct;return filter==='all'||filter==='wrong'&&wrong||filter==='blank'&&ans===undefined||filter==='needs'&&(ans!==q.correct||isFlagged(q.id)||a.confidence?.[q.id]==='low');}).map(q=>{const x=st.questions[q.id]||{},order=a.optionOrders?.[q.id]||[0,1,2,3],ans=a.answers[q.id],label=ans===undefined?'未解答':ans===q.correct?'正解':'誤答';return `<details class="review" data-reviewed="${q.id}"><summary><span class="${ans===q.correct?'good':'bad'}">${label}</span> · ${q.id} · ${esc(q.concept_label||q.topic)} ${x.flagged?'★':''}</summary><div class="muted small">累計誤答 ${x.wrong||0} / 回答 ${x.answered||0} · 連続正解 ${x.streak||0} · 次回 ${date(x.dueAt)} · ${LABELS[a.confidence?.[q.id]||'unknown']} · ${a.timesMs?.[q.id]!==undefined?secs(a.timesMs[q.id]/1000):'時間未記録'}</div><div class="question">${esc(q.stem)}</div>${order.map((c,i)=>`<p class="option-review"><b>${'ABCD'[i]}</b> ${esc(q.options[c])}${ans===c?' ← あなたの回答':''}</p>`).join('')}<div class="explain"><b>正答 ${'ABCD'[order.indexOf(q.correct)]} · ${esc(q.topic)}</b><p>${esc(q.explanation_ja)}</p>${order.map((c,i)=>`<p>${'ABCD'[i]}：${esc(q.distractors_ja[c])}</p>`).join('')}<a href="${esc(q.source_url)}" target="_blank" rel="noopener">公式資料 ↗</a><div class="small muted">${esc(q.validation)}</div></div>${translationPanel(q,order,ans)}${reasonControls(a,q)}</details>`;}).join('')||'<p class="empty">該当する問題はありません。</p>';}
function bindReview(a){app.querySelectorAll('[data-reviewed]').forEach(d=>d.ontoggle=()=>{if(d.open){E.markReviewed(state,d.dataset.reviewed);save();}});app.querySelectorAll('[data-cause]').forEach(s=>s.onchange=()=>{a.causes??={};a.causes[s.dataset.cause]=s.value;save();});app.querySelectorAll('[data-suggest]').forEach(b=>b.onclick=()=>{a.causes??={};a.causes[b.dataset.suggest]=b.dataset.value;save();const sel=app.querySelector(`[data-cause="${b.dataset.suggest}"]`);if(sel)sel.value=b.dataset.value;b.textContent='原因を記録しました';});app.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{a.notes??={};a.notes[t.dataset.note]=t.value.slice(0,5000);save();});app.querySelectorAll('[data-retry-one]').forEach(b=>b.onclick=()=>begin({key:`retry-${Date.now()}`,mode:'wrong',title:'1問再テスト',ids:[b.dataset.retryOne],recallFirst:true}));app.querySelectorAll('[data-similar]').forEach(b=>b.onclick=()=>startSelection('similar',5,{sourceId:b.dataset.similar,recallFirst:true}));app.querySelectorAll('[data-review-flag]').forEach(b=>b.onclick=()=>{a.flags??={};a.flags[b.dataset.reviewFlag]=!isFlagged(b.dataset.reviewFlag);state.settings['flag:'+b.dataset.reviewFlag]=a.flags[b.dataset.reviewFlag];save();b.textContent=a.flags[b.dataset.reviewFlag]?'★ 要復習を解除':'☆ 要復習にする';});}

    for(const id of ['cloudSave','cloudLoad','cloudLogout'])find(id).disabled=busy||!user;
  }
  function revisionKey(){return 'spark-cloud-revision:'+config.firebase.projectId+':'+user.uid;}
  function remember(n){localStorage.setItem(revisionKey(),String(n));revision=n;}
  async function run(action){if(busy)return;busy=true;render();try{await action();}catch(e){message='処理できませんでした：'+(e.code||e.message)+ '。端末の記録は保持しています。';}finally{busy=false;render();}}
  find('cloudLogin').onclick=()=>run(async()=>{
    if(!/^https?:$/.test(location.protocol))throw Error('ログインにはHTTPSの公開URLまたはlocalhostが必要です（file://では利用できません）');
    if(!adapter)adapter=await SparkFirebase.connect(config,(next,error)=>{
      epoch++;user=next;
      const stored=user?Number(localStorage.getItem(revisionKey())||0):0;
      revision=Number.isSafeInteger(stored)&&stored>=0?stored:0;
      message=error||'端末を替えた場合は、まずクラウドから読込してください。';render();
    });
    await adapter.login();
  });
  find('cloudLogout').onclick=()=>run(async()=>{await adapter.logout();message='ログアウトしました。';});
  find('cloudSave').onclick=()=>run(async()=>{
    if(storageBlocked)throw Error('先に記録画面で端末の保存エラーを解消してください');
    tickTime();save();
    const text=JSON.stringify(E.normalizeState(state)),token=epoch;
    const next=await adapter.write(text,revision);
    if(token!==epoch)throw Error('ログイン状態が変わりました');
    remember(next);message='クラウドに保存しました（'+new Date().toLocaleString('ja-JP')+'）。保存中に行った追加操作は次回の保存対象です。';
  });
  find('cloudLoad').onclick=()=>run(async()=>{
    if(activeKey)throw Error('ホームに戻ってから読込してください');
    if(storageBlocked)throw Error('先に記録画面で端末の保存エラーを解消してください');
    const before=JSON.stringify(state),token=epoch,remote=await adapter.read();
    if(token!==epoch)throw Error('ログイン状態が変わりました');
    if(!remote.text){remember(0);message='クラウドに記録はありません。この端末の記録を保存できます。';return;}
    const incoming=E.normalizeState(JSON.parse(remote.text));
    if(JSON.stringify(state)!==before||activeKey)throw Error('読込中に学習記録が変わりました。もう一度読込してください');
    if(!confirm('この端末の記録をバックアップして、クラウドの記録に切り替えます。続行しますか？\n端末側だけの回答はバックアップJSONから「記録」で統合できます。'))return;
    // Durable backup and replacement must succeed before changing live memory.
    localStorage.setItem('spark-before-cloud-load',before);
    download(JSON.parse(before),'spark-before-cloud-load-'+Date.now()+'.json');
    localStorage.setItem(KEY,JSON.stringify(incoming));
    state=incoming;remember(remote.revision);navigate('home');
    message='クラウドから読み込みました。直前の端末記録をJSONとして書き出しました。';
  });
  render();
})();
</script>
</body></html>
